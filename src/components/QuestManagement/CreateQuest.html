<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create Quest - YGG Arcade</title>

    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Orbitron:wght@400;700;900&display=swap"
      rel="stylesheet"
    />

    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: "Press Start 2P", cursive;
        background: #0b233d;
        color: #fff;
        height: 100vh;
        overflow: hidden;
      }

      /* ====== LAYOUT ====== */
      .app {
        display: flex;
        height: 100vh;
      }

      /* ====== SIDEBAR ====== */
      .sidebar {
        width: 260px;
        background: linear-gradient(180deg, #ff8c00, #ff2fa1, #00c8ff);
        padding: 20px;
        display: flex;
        flex-direction: column;
      }

      .logo {
        font-size: 1.3rem;
        margin-bottom: 30px;
      }

      .profile {
        background: rgba(0, 0, 0, 0.35);
        padding: 15px;
        border-radius: 6px;
        font-size: 0.55rem;
        margin-bottom: 20px;
      }

      .nav a {
        display: block;
        padding: 12px;
        margin-bottom: 10px;
        font-size: 0.55rem;
        text-decoration: none;
        color: #fff;
        border-radius: 4px;
        background: rgba(0, 0, 0, 0.25);
        transition: 0.2s;
      }

      .nav a:hover {
        background: rgba(0, 0, 0, 0.5);
      }

      /* ====== MAIN CONTENT ====== */
      .main {
        flex: 1;
        padding: 25px;
        overflow-y: auto;
        background: #0b233d;
      }

      h1 {
        color: #00ffff;
        text-shadow:
          0 0 15px #00ffff,
          0 0 40px #ff00ff;
        margin-bottom: 25px;
        font-size: 1.5rem;
      }

      /* ====== FORM ====== */
      form {
        display: flex;
        flex-direction: column;
        gap: 15px;
        max-width: 500px;
      }

      input[type="text"],
      input[type="number"],
      textarea {
        padding: 10px;
        border: none;
        border-radius: 6px;
        font-family: "Press Start 2P", monospace;
      }

      button {
        background: linear-gradient(90deg, #ff8c00, #ff2fa1);
        border: none;
        padding: 12px;
        color: #fff;
        font-weight: bold;
        cursor: pointer;
        border-radius: 6px;
        transition: 0.25s;
      }

      button:hover {
        background: linear-gradient(90deg, #ff2fa1, #00c8ff);
      }

      /* ====== SCANLINES ====== */
      .scanlines::before {
        content: "";
        position: fixed;
        inset: 0;
        background: repeating-linear-gradient(
          to bottom,
          rgba(255, 255, 255, 0.03),
          rgba(255, 255, 255, 0.03) 1px,
          transparent 1px,
          transparent 3px
        );
        pointer-events: none;
      }
    </style>
  </head>

  <body class="scanlines">
    <div class="app">
      <!-- SIDEBAR -->
      <aside class="sidebar">
        <div class="logo">🎮 AEL</div>

        <div class="profile">
          USER: ADMIN<br /><br />
          LEVEL: 99<br /><br />
          XP: 999 / 1000
        </div>

        <nav class="nav">
          <a href="MainDashboard.html">HOME</a>
          <a href="QuestPage.html">QUESTS</a>
          <a href="#">CAMPAIGNS</a>
          <a href="#">REFERRALS</a>
          <a href="#">REWARDS</a>
        </nav>

        <br />
        <!-- Quest Management -->
        <div class="nav-section">
          <h4>Quest Management</h4>
          <nav class="nav">
            <a href="ManageQuest.html">🛠️ Manage Quest</a>
            <a href="QuestStats.html">📊 Quest Stats</a>
          </nav>
        </div>

        <br />
        <!-- User Management -->
        <div class="nav-section">
          <h4>User Management</h4>
          <nav class="nav">
            <a href="ManageUsers.html">🛠️ Manage Users</a>
          </nav>
        </div>
      </aside>

      <!-- MAIN CONTENT -->
      <main class="main">
        <h1>➕ Create New Quest</h1>

        <form action="#" method="POST">
          <label for="questName">Quest Name</label>
          <input
            type="text"
            id="questName"
            name="questName"
            placeholder="Enter quest name"
            required
          />

          <label for="questDesc">Description</label>
          <textarea
            id="questDesc"
            name="questDesc"
            rows="5"
            placeholder="Enter quest description"
            required
          ></textarea>

          <label for="exp">EXP</label>
          <input
            type="number"
            id="exp"
            name="exp"
            placeholder="e.g., 150"
            required
          />

          <label for="gold">GOLD</label>
          <input
            type="number"
            id="gold"
            name="gold"
            placeholder="e.g., 30"
            required
          />

          <button type="submit">Create Quest</button>
        </form>
      </main>
    </div>
  </body>
</html>
