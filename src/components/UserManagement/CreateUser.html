<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Manage Users - AEL Arcade</title>

    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Orbitron:wght@400;700;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="user.css" />
  </head>

  <body class="scanlines">
    <div class="app">
      <!-- Main Content -->
      <main class="main">
        <h1>🛠️ Manage Users</h1>
        <button id="openModal" class="add-user-btn">➕ Add User</button>

        <div class="user-cards" id="userCards"></div>

        <!-- Add User Modal -->
        <div id="userModal" class="modal">
          <div class="modal-content">
            <span class="close">&times;</span>
            <h2>➕ Add New User</h2>
            <form id="addUserForm">
              <input
                type="text"
                id="fullName"
                placeholder="Full Name"
                required
              />
              <input
                type="text"
                id="username"
                placeholder="Username"
                required
              />
              <input type="email" id="email" placeholder="Email" required />
              <input
                type="number"
                id="level"
                placeholder="Level"
                min="1"
              />
              <input
                type="password"
                id="password"
                placeholder="Password"
                required
              />

              <select id="role" required>
                <option value="">Select Role</option>
                <option value="member">Member</option>
                <option value="questmaker">Quest Maker</option>
                <option value="superadmin">Super Admin</option>
              </select>

              <!-- Extra fields hidden by default -->
              <div id="extraFields" style="display: none; margin-top: 10px">
                <select id="department">
                  <option value="">Select Department</option>
                  <option value="Technical Department">Technical Department</option>
                </select>

                <select id="subdepartment">
                  <option value="">Select Sub Department</option>
                  <option value="Web Developer">Web Developer</option>
                  <option value="Quality Assurance">Quality Assurance</option>
                </select>
              </div>

              <button type="submit">Add User</button>
            </form>
          </div>
        </div>

        <!-- Edit User Modal -->
        <div id="editModal" class="modal">
          <div class="modal-content">
            <span class="close">&times;</span>
            <h2>✏️ Edit User</h2>
            <form id="editUserForm">
              <input type="text" id="editFullName" required />
              <input type="text" id="editUsername" disabled />
              <input type="email" id="editEmail" required />
              <input type="number" id="editLevel" min="1" />

              <select id="editRole" required>
                <option value="">Select Role</option>
                <option value="member">Member</option>
                <option value="questmaker">Quest Maker</option>
                <option value="superadmin">Super Admin</option>
              </select>

              <div id="editExtraFields" style="display: none">
                <select id="editDepartment">
                  <option value="">Select Department</option>
                  <option value="QA Department">QA Department</option>
                </select>

                <select id="editSubdepartment">
                  <option value="">Select Sub Department</option>
                  <option value="Web Developer">Web Developer</option>
                  <option value="Quality Assurance">Quality Assurance</option>
                </select>
              </div>

              <button type="submit">Update User</button>
            </form>
          </div>
        </div>

        <!-- Delete User Modal -->
        <div id="deleteModal" class="modal">
          <div class="modal-content">
            <span class="close">&times;</span>
            <h2>🗑️ Delete User</h2>
            <p>
              Are you sure you want to delete <span id="deleteUsername"></span>?
            </p>
            <button id="confirmDelete" class="modal-btn danger-btn">
              Yes, Delete
            </button>
            <button id="cancelDelete" class="modal-btn">Cancel</button>
          </div>
        </div>
      </main>
    </div>
    <script src="router.js"></script>
    <script src="user.js"></script>
  </body>
</html>
