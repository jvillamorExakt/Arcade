<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>EAL | Quest Board</title>

    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Orbitron:wght@400;700;900&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="questboard.css" />
    <link rel="stylesheet" href="../QuestManagement/managequest.css" />
  </head>

  <body>
    <div class="app">
      <!-- SIDEBAR -->
      <aside class="sidebar">
        <div class="logo">🎮 EAL</div>
      </aside>

      <!-- MAIN -->
      <main class="main">
        <br />
        <div class="page-title">QUEST BOARD</div>
        <div class="page-subtitle">
          Browse available community quests you may participate in.
        </div>

        <!-- TAB NAVIGATION -->
        <div class="quest-tabs">
          <button class="tab-btn active" data-tab="open-quest">OPEN QUEST</button>
          <button class="tab-btn" data-tab="my-quest">MY QUEST</button>
          <button class="tab-btn" data-tab="group-quest">GROUP QUEST</button>
        </div>

        <!-- OPEN QUEST TAB -->
        <div class="tab-content active" id="open-quest">
          <section class="quest-grid" id="openQuestGrid"></section>
        </div>

        <!-- MY QUEST TAB -->
        <div class="tab-content" id="my-quest">
          <section class="quest-grid" id="myQuestGrid">
            
          </section>
          
        </div>

        <!-- GROUP QUEST TAB -->
        <div class="tab-content" id="group-quest">
          <section class="quest-grid" id="groupQuestGrid"></section>
        </div>

        <!-- View Details Modal -->
        <div id="viewDetailsModal" class="modal">
          <div class="modal-content">
            <span class="close">&times;</span>
            <h2 id="viewQuestTitle">Quest Details</h2>
            <p>
              <strong>Description:</strong> <span id="viewQuestDesc"></span>
            </p>
            <p><strong>EXP:</strong> <span id="viewQuestExp"></span></p>
            <p><strong>GOLD:</strong> <span id="viewQuestGold"></span></p>
            <p><strong>Difficulty:</strong> <span id="viewQuestDiff"></span></p>
            <p><strong>Type:</strong> <span id="viewQuestType"></span></p>
            <p><strong>Status:</strong> <span id="viewQuestStatus"></span></p>
            <p>
              <strong>Department:</strong>
              <span id="viewQuestDepartment"></span>
            </p>
            <p>
              <strong>Sub Department:</strong>
              <span id="viewQuestCategory"></span>
            </p>
            <p>
              <strong>Assigned User:</strong>
              <span id="viewAssignedUser">None</span>
            </p>
          </div>
        </div>
      </main>
    </div>
    
    <script src="router.js"></script>
    <script src="questboard.js">
    
    </script>
  </body>
</html>
